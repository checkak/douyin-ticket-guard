name: Build unsigned IPA

# 无需本地 Mac：push 上去用 GitHub 的 macOS runner 编出 .ipa，Artifacts 里下载。
on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ipa.yml"

jobs:
  ipa:
    runs-on: macos-15          # macos-14 镜像已退役（会秒取消），15 实测可用
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@v4

      - name: 环境信息
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          sw_vers

      - name: 安装 xcodegen
        run: |
          brew update >/dev/null || true
          brew install xcodegen || brew upgrade xcodegen

      - name: 生成 Xcode 工程
        run: |
          xcodegen --version
          xcodegen generate
          ls -la
          xcodebuild -list -project DouyinTicketGuard.xcodeproj

      - name: 编译（未签名）
        run: |
          set -o pipefail
          xcodebuild \
            -project DouyinTicketGuard.xcodeproj \
            -scheme DouyinTicketGuard \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: 上传编译日志（失败时排查用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/build.log
          if-no-files-found: warn

      - name: 组装 .ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/DouyinTicketGuard.app"
          echo "产物目录:"; ls -la build/Build/Products/Release-iphoneos/ || true
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry DouyinTicketGuard-unsigned.ipa Payload
          ls -lh DouyinTicketGuard-unsigned.ipa
          shasum -a 256 DouyinTicketGuard-unsigned.ipa | tee ipa.sha256

      - name: 上传 .ipa
        uses: actions/upload-artifact@v4
        with:
          name: DouyinTicketGuard-ipa
          path: |
            ios/DouyinTicketGuard-unsigned.ipa
            ios/ipa.sha256
          if-no-files-found: error
          retention-days: 30
